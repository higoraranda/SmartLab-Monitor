# ==============================================
# RENDER.YAML — Configuração do Serviço no Render
# ==============================================

services:
  - type: web
    name: smartlab-monitor
    runtime: docker
    plan: free

    envVars:
      - key: PORT
        value: 8080

      # Ativa o perfil de produção (PostgreSQL via Neon)
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Cole aqui a JDBC connection string do Neon
      # Formato: jdbc:postgresql://xxx.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        value: COLE_AQUI_A_URL_DO_NEON

      # Usuário do banco (visível no painel do Neon em Connection Details)
      - key: DB_USER
        value: COLE_AQUI_O_USUARIO_DO_NEON

      # Senha do banco — configure como "Secret" no painel do Render
      - key: DB_PASSWORD
        value: COLE_AQUI_A_SENHA_DO_NEON
