spring.application.name=smartlab-monitor

# ${PORT:8080} = usa a variável PORT se existir (Render injeta isso), senão usa 8080
server.port=${PORT:8080}

# =====================================================================
# BANCO DE DADOS — H2 em memória (perfil padrão: desenvolvimento local)
# Para produção no Render, o perfil "prod" substitui estas configurações
# =====================================================================
spring.datasource.url=jdbc:h2:mem:smartlabdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (http://localhost:8080/h2-console) — só em desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Garante que o data.sql rode depois que o Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true

# Swagger (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# Mensagens de erro detalhadas
server.error.include-message=always
