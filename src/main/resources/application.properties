spring.application.name=smartlab-monitor

# ${PORT:8080} — usa a variável PORT se existir, senão usa 8080
server.port=${PORT:8080}

# PostgreSQL — defina DATABASE_URL no ambiente local ou na plataforma de deploy
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desabilita o data.sql — dados persistem no banco, não precisa re-inserir a cada inicialização
spring.sql.init.mode=never

# Swagger (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# Mensagens de erro detalhadas
server.error.include-message=always
