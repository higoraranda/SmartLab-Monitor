# =====================================================================
# PERFIL DE PRODUÇÃO — PostgreSQL via Neon
#
# Este arquivo é ativado automaticamente quando:
#   SPRING_PROFILES_ACTIVE=prod
# (configurado no render.yaml)
#
# Você deve configurar DATABASE_URL nas variáveis de ambiente do Render.
# O valor vem do painel do Neon: Database → Connection string → JDBC
# Formato: jdbc:postgresql://xxx.neon.tech/neondb?sslmode=require
# =====================================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL com Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Não roda o data.sql em produção — o banco persiste entre reinicializações
spring.sql.init.mode=never

# H2 Console desativado em produção
spring.h2.console.enabled=false
